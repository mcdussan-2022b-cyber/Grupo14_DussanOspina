version: '3.8'

services:
  db:
    image: postgres:15
    container_name: etl_postgres
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl2026
      POSTGRES_DB: jsonplaceholder_etl
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  etl:
    build: .
    container_name: etl_pipeline
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: etl_user
      DB_PASSWORD: etl2026
      DB_NAME: jsonplaceholder_etl
    command: python scripts/loader.py

  dashboard:
    build: .
    container_name: etl_dashboard
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: etl_user
      DB_PASSWORD: etl2026
      DB_NAME: jsonplaceholder_etl
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  pgdata:
